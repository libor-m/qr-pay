<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="popup.css">
</head>

<body>
<form>
  <label for="to">Příjemce</label>
  <input id="to" list="to-options" /><datalist id="to-options"></datalist>

  <label for="bank">Banka</label>
  <input id="bank" readonly />

  <label for="amount">Částka</label>
  <input id="amount" list="amount-options" inputmode="decimal" /><datalist id="amount-options"></datalist>

  <label for="vs">Variabilní symbol</label>
  <input id="vs" list="vs-options" inputmode="numeric" /><datalist id="vs-options"></datalist>

  <label for="ss">Specifický symbol</label>
  <input id="ss" list="ss-options" inputmode="numeric" /><datalist id="ss-options"></datalist>

  <label for="ks">Konstantní symbol</label>
  <input id="ks" list="ks-options" inputmode="numeric" /><datalist id="ks-options"></datalist>

  <label for="message">Zpráva pro příjemce</label>
  <input id="message" />
</form>

<div id="qr"><img id="qr_img" src="img/empty-qr.png" width="298" height="293" alt="QR platba"></div>

<script type="module" src="popup.js"></script>
</body>
</html>
